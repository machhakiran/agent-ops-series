name: langgraph-react-agent
displayName: "Machha Kiran — LangGraph ReAct Agent"
framework: langgraph
description: "Production ReAct agent with LangGraph, MCP tools (GitHub, Fetch, Calculator), and local/cloud inference by Machha Kiran (@machhakiran)."
env:
  required:
    - API_KEY
    - BASE_URL
    - MODEL_ID
  optional:
    - PORT
    - CONTAINER_IMAGE
    - AUTH_ENABLED
    - AUTH_AUDIENCE
    - AUTH_ALLOWED_SERVICEACCOUNTS
    - GITHUB_TOKEN
    - FIRECRAWL_API_KEY

    <line x1="40" y1="28" x2="24" y2="56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="28" x2="56" y2="56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="56" x2="56" y2="56" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="40" cy="46" r="3" fill="#ffffff" opacity="0.8"/>
  </g>
  <!-- Brand Text -->
  <text x="105" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
